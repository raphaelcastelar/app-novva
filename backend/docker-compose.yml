services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: novva
      POSTGRES_USER: novva
      POSTGRES_PASSWORD: novva_local
    ports:
      - "5432:5432"
    volumes:
      - novva_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novva -d novva"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    profiles: ["full"]
    environment:
      DATABASE_URL: postgresql://novva:novva_local@postgres:5432/novva
      JWT_SECRET: ${JWT_SECRET:-desenvolvimento-local-chave-com-mais-de-32-caracteres}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost}
      NODE_ENV: development
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  novva_postgres:
